name: Build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        config: [targets/core/development.yaml]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify build policy
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Select declared software profile
        id: route
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
          TARGET: ${{ matrix.config }}
        run: python scripts/build_policy.py route --base "$BASE" --event "$EVENT" --target "$TARGET" --github-output "$GITHUB_OUTPUT"
      - name: Dependency cache identity
        if: steps.route.outputs.full_build == 'true'
        id: pip-key
        run: python scripts/build_policy.py cache --github-output "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.route.outputs.full_build == 'true'
        with:
          path: ~/.cache/pip
          key: pip-${{ steps.pip-key.outputs.key }}
      - name: Registry behavior tests
        if: steps.route.outputs.full_build == 'true'
        run: g++ -std=c++17 -Wall -Wextra -Werror tests/board_registry.cpp -o /tmp/board-registry && /tmp/board-registry
      - name: Install declared dependencies
        if: steps.route.outputs.full_build == 'true'
        run: python -m pip install -r requirements.txt
      - name: Resolved toolchain cache identity
        if: steps.route.outputs.full_build == 'true'
        id: toolchain-key
        run: python scripts/build_policy.py cache --resolved-tools --github-output "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        if: steps.route.outputs.full_build == 'true'
        with:
          path: |
            ~/.cache/esphome/idf/dist
            ~/.cache/esphome/idf/frameworks
            ~/.cache/esphome/idf/tools
          key: toolchain-${{ steps.toolchain-key.outputs.key }}
      - name: Compile core-development
        if: steps.route.outputs.full_build == 'true'
        env:
          TARGET: ${{ matrix.config }}
        run: esphome compile "$TARGET"
      - name: Report metadata-only verification
        if: steps.route.outputs.full_build == 'false'
        run: echo 'Metadata-only PR verified. Compilation was not requested; this is not firmware or hardware qualification.'
