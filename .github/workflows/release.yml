name: Prepare firmware release
on:
  workflow_dispatch:
    inputs:
      target:
        description: Approved product and hardware revision
        required: true
      version:
        description: Version as MAJOR.MINOR.PATCH
        required: true
permissions:
  contents: read
jobs:
  build:
    if: github.ref == 'refs/heads/main' && github.actor == 'mikefarwell'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve approved target
        id: target
        env:
          TARGET: ${{ inputs.target }}
          VERSION: ${{ inputs.version }}
        run: python scripts/release_target.py
      - run: python -m pip install -r requirements.txt
      - name: Compile and package
        env:
          CONFIG: ${{ steps.target.outputs.config }}
          TAG: ${{ steps.target.outputs.tag }}
        run: |
          esphome compile "$CONFIG"
          mkdir dist
          for type in factory ota; do
            mapfile -t binaries < <(find "$(dirname "$CONFIG")/.esphome/build" -name "firmware.$type.bin" -type f)
            test "${#binaries[@]}" -eq 1
            cp "${binaries[0]}" "dist/$TAG.$type.bin"
          done
          cd dist
          sha256sum *.bin > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error
  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "$TAG" --notes "Review hardware compatibility and flashing instructions before publishing."
