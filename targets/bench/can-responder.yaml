substitutions:
  can_bit_rate: "1000KBPS"
  fixture_id_byte: "0x80"

esphome:
  name: trailnexus-can-responder
  includes:
    - ../../components/trailnexus_core/can_discovery.h

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:

canbus:
  - platform: esp32_can
    id: fixture_can
    tx_pin: GPIO4
    rx_pin: GPIO5
    can_id: 0x1A100004
    use_extended_id: true
    bit_rate: ${can_bit_rate}
    on_frame:
      - can_id: 0x1A100000
        can_id_mask: 0x1FFFFFFC
        use_extended_id: true
        then:
          - lambda: |-
              if (remote_transmission_request)
                return;
              static trailnexus::can::DiscoveryResponder responder;
              const trailnexus::can::Identity fixture{${fixture_id_byte}};
              const auto reply = responder.ingest(fixture, can_id, x.data(), x.size(),
                                                  millis(), 100);
              if (reply) {
                id(fixture_can).send_data(trailnexus::can::reply_base + static_cast<uint8_t>(*reply),
                                          true, {trailnexus::can::protocol_version, x[2], x[3]});
              }
